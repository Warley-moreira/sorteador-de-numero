<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="./assets/bingo.png">
    <link rel="stylesheet" href="style.css">
    <title>Sorteado-de-numero</title>
</head>

<body>
    <main class="conteudo">

        <img src="./assets/imagemdeDado.png" alt="imagem-de-sorteador">
        <h1>Sortear um Número</h1>

        <div>
            <input id="input-min" type="number" placeholder="entre">
            <input id="input-max" type="number" placeholder="e">
        </div>

        <button id="btn-sortear">Sortear</button>

        <section class="resultado">
            <h2>O numero sorteado é:</h2>
            <p class="numero-final">00</p>
        </section>
    </main>
</body>
<script src="app.js"></script>

</html>
